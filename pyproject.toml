[project]
name = "mcp-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anurag Chaudhary", email = "chaudharyanurag801@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncio>=4.0.0",
    "fastmcp>=3.4.11",
    "langchain>=1.4.9",
    "langchain-groq>=1.1.3",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.20",
    "python-dotenv>=1.2.4",
    "uuid>=1.30",
]

[project.scripts]
mcp-server = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
